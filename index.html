<head>

<title>ฝากงาน · Fak ngan</title>

<style>
:root{--bg:#fff4f1;--card:#fff;--ink:#4a3340;--sub:#9a7f8c;--pink:#ff7a93;--pink2:#ffe1e7;--mint:#7fd8bd;--mint2:#dff7ef;--sun:#ffd86b;--sun2:#fff4cf;--line:#f5dfe3}
@media(prefers-color-scheme:dark){:root{--bg:#2a1f27;--card:#38293a;--ink:#fbeaf0;--sub:#c3a6b4;--pink2:#5a2f3e;--mint2:#24473d;--sun2:#4d4220;--line:#4d3a49}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Mali','Sarabun','Noto Sans Thai',sans-serif;font-size:16px;line-height:1.5}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1,h2,h3{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 13px;width:100%;outline:none}
input:focus,select:focus,textarea:focus,button:focus-visible{border-color:var(--pink);outline:2px solid var(--pink);outline-offset:1px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}
.btn{background:var(--pink);color:#fff;font-weight:700;padding:12px 18px;border-radius:999px;width:100%;box-shadow:0 4px 0 #e25a78}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #e25a78}
.ghost{background:var(--pink2);color:var(--ink);box-shadow:none;width:auto;padding:8px 14px;font-size:14px}
.hero{text-align:center;padding:30px 0 8px}
.logo{font-size:44px}.hero h1{font-size:30px;color:var(--pink)}.hero p{color:var(--sub);margin:4px 0 0}
.panel{background:var(--card);border-radius:24px;padding:18px;margin-top:16px;border:2px solid var(--line)}
.tabs{display:flex;gap:6px;background:var(--pink2);padding:5px;border-radius:999px;margin-bottom:6px}
.tabs button{flex:1;background:none;padding:9px;border-radius:999px;font-weight:600;color:var(--sub)}
.tabs button.on{background:var(--card);color:var(--pink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.pick{display:flex;flex-direction:column;align-items:center;gap:8px}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--sun2);border:3px solid var(--sun);object-fit:cover;display:grid;place-items:center;font-size:34px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.err{color:#d9455f;font-size:14px;min-height:20px;margin-top:8px;text-align:center}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top .grow{flex:1;min-width:0}
.top h2{font-size:20px}.top small{color:var(--sub)}
.sm{width:42px;height:42px;font-size:18px;border-width:2px}
.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.room{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px 4px;text-align:center;font-weight:700;font-size:18px}
.room small{display:block;color:var(--sub);font-weight:400;font-size:12px}
.room:nth-child(3n+1){background:var(--pink2)}.room:nth-child(3n+2){background:var(--mint2)}.room:nth-child(3n){background:var(--sun2)}
.room:active{transform:scale(.96)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{white-space:nowrap;background:var(--card);border:2px solid var(--line);padding:7px 14px;border-radius:999px;font-size:14px}
.chip.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.post{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px}
.who{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.who .avatar{width:38px;height:38px;font-size:16px;border-width:2px}
.who b{display:block;line-height:1.2}.who small{color:var(--sub);font-size:12px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;margin-right:6px}
.tag.todo{background:var(--sun2);color:#a97a00}.tag.answer{background:var(--mint2);color:#1f8a6a}.tag.sub{background:var(--pink2)}
.post h3{font-size:17px;margin:6px 0 2px}.post p{margin:4px 0;color:var(--sub);white-space:pre-wrap;word-break:break-word}
.due{font-size:13px;color:#d9455f}
.acts{display:flex;gap:8px;margin-top:10px}
.link{background:var(--mint);color:#134e3d;font-weight:700;text-decoration:none;padding:8px 14px;border-radius:999px;font-size:14px}
.del{background:none;color:var(--sub);font-size:13px;margin-left:auto}
.empty{text-align:center;color:var(--sub);padding:40px 10px}.empty .logo{font-size:48px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:auto;padding:14px 22px;border-radius:999px;z-index:5}
.sheet{position:fixed;inset:0;background:rgba(60,30,45,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:11px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-weight:600}
.seg button.on.todo{background:var(--sun2);border-color:var(--sun)}.seg button.on.answer{background:var(--mint2);border-color:var(--mint)}
.note{font-size:12px;color:var(--sub);text-align:center;margin-top:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:calc(33.3% - 6px);aspect-ratio:1;object-fit:cover;border-radius:14px;border:2px solid var(--line);cursor:zoom-in}
.thumbs.one img{width:100%;aspect-ratio:auto;max-height:320px}
.pics{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pics .ph{position:relative;width:72px;height:72px}
.pics .ph img{width:100%;height:100%;object-fit:cover;border-radius:14px;border:2px solid var(--line)}
.pics .ph button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--pink);color:#fff;font-size:13px;line-height:1;padding:0}
.pics .addp{width:72px;height:72px;border-radius:14px;border:2px dashed var(--pink);background:var(--pink2);color:var(--pink);font-size:24px;display:grid;place-items:center;cursor:pointer;margin:0;font-weight:400}
.viewer{position:fixed;inset:0;background:rgba(30,15,25,.9);z-index:20;display:grid;place-items:center;padding:16px}
.viewer img{max-width:100%;max-height:100%;border-radius:12px}
.brand{display:block;width:100%;max-width:340px;margin:0 auto}
.brand.s{max-width:230px;margin:0 auto 10px}
.pbtn{background:none;padding:0;border-radius:50%;line-height:0}
.ban{background:none;color:#d9455f;font-size:13px}
.rt{margin-left:auto;display:flex;gap:10px}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

const ROOMS = Array.from({length:13},(_,i)=>i+1);
const SUBJECTS = ['คณิตศาสตร์','วิทยาศาสตร์','ภาษาไทย','ภาษาอังกฤษ','สังคมศึกษา','สุขศึกษา/พละ','ศิลปะ/ดนตรี','การงาน/คอม','อื่นๆ'];
const LIVE = typeof firebase !== 'undefined' && FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY";

/* ---------- ฐานข้อมูล: Firebase (Auth + Firestore) หรือ โหมดทดลอง (localStorage) ---------- */
let DB;
const sha = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('fakngan:' + s)))].map(x => x.toString(16).padStart(2,'0')).join('');
if (LIVE) {
  firebase.initializeApp(FIREBASE_CONFIG);
  const f = firebase.firestore(), au = firebase.auth();
  const emailOf = async id => (await sha(id)).slice(0,24) + '@fakngan.app';
  const profile = async u => {
    const [p,a,b] = await Promise.all([f.collection('users').doc(u.uid).get(), f.collection('admins').doc(u.uid).get(), f.collection('bans').doc(u.uid).get()]);
    const d = p.exists ? p.data() : {};
    return {id:u.uid, name:d.name || 'ผู้ใช้', avatar:d.avatar || '', admin:a.exists, banned:b.exists};
  };
  DB = {
    signup: async (id,name,pw,avatar) => {
      const c = await au.createUserWithEmailAndPassword(await emailOf(id), pw);
      await f.collection('users').doc(c.user.uid).set({name, avatar, created: Date.now()});
      return {id:c.user.uid, name, avatar, admin:false, banned:false};
    },
    login: async (id,pw) => profile((await au.signInWithEmailAndPassword(await emailOf(id), pw)).user),
    restore: () => new Promise(ok => { const un = au.onAuthStateChanged(async u => { un(); try { ok(u ? await profile(u) : null); } catch(e){ ok(null); } }); }),
    logout: () => au.signOut(),
    watch: (room,cb) => f.collection('posts').where('room','==',room).onSnapshot(s => cb(s.docs.map(d => ({id:d.id,...d.data()})))),
    add: p => f.collection('posts').add(p),
    del: id => f.collection('posts').doc(id).delete(),
    updateProfile: (uid,d) => f.collection('users').doc(uid).update(d),
    getUsers: async uids => (await Promise.all(uids.map(u => f.collection('users').doc(u).get()))).map((d,i) => d.exists ? [uids[i], d.data()] : null).filter(Boolean),
    ban: (uid,name) => f.collection('bans').doc(uid).set({name, at: Date.now()}),
    unban: uid => f.collection('bans').doc(uid).delete(),
    bans: cb => f.collection('bans').onSnapshot(s => cb(s.docs.map(d => ({id:d.id,...d.data()}))))
  };
} else {
  const rd = k => { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch(e){ return {}; } };
  const wr = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
  const subs = [];
  const emit = () => subs.forEach(s => s());
  DB = {
    signup: async (id,name,pw,avatar) => { const a = rd('fn_users'); if (a[id]) throw {code:'auth/email-already-in-use'}; a[id] = {name, avatar, hash: await sha(pw)}; wr('fn_users', a); return {id, name, avatar, admin:false, banned:false}; },
    login: async (id,pw) => { const u = rd('fn_users')[id]; if (!u || u.hash !== await sha(pw)) throw {code:'auth/invalid-credential'}; return {id, name:u.name, avatar:u.avatar || '', admin:false, banned:false}; },
    restore: async () => { try { return JSON.parse(localStorage.getItem('fn_me')); } catch(e){ return null; } },
    logout: async () => {},
    watch: (room,cb) => { const s = () => cb(Object.entries(rd('fn_posts')).map(([id,p]) => ({id,...p})).filter(p => p.room === room)); subs.push(s); s(); return () => subs.splice(subs.indexOf(s),1); },
    add: async p => { const a = rd('fn_posts'); a['p'+Date.now()] = p; wr('fn_posts', a); emit(); },
    del: async id => { const a = rd('fn_posts'); delete a[id]; wr('fn_posts', a); emit(); },
    updateProfile: async (uid,d) => { const a = rd('fn_users'); if (a[uid]) { Object.assign(a[uid], d); wr('fn_users', a); } },
    getUsers: async uids => { const a = rd('fn_users'); return uids.filter(u => a[u]).map(u => [u, a[u]]); },
    ban: async () => {}, unban: async () => {}, bans: cb => { cb([]); return () => {}; }
  };
}

/* ---------- ตัวช่วย ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => { u = (u||'').trim(); if (!u) return ''; if (!/^https?:\/\//i.test(u)) u = 'https://' + u; try { return new URL(u).href; } catch(e){ return ''; } };
const ago = t => { const m = Math.floor((Date.now()-t)/60000); if (m<1) return 'เมื่อกี้'; if (m<60) return m+' นาทีที่แล้ว'; const h=Math.floor(m/60); if (h<24) return h+' ชม.ที่แล้ว'; return Math.floor(h/24)+' วันที่แล้ว'; };
const av = (img,name,cls='') => `<div class="avatar ${cls}">${img ? `<img src="${esc(img)}" alt="">` : esc((name||'?')[0].toUpperCase())}</div>`;
const fit = (file, max = 900) => new Promise((ok,no) => {
  const r = new FileReader();
  r.onerror = no;
  r.onload = () => { const im = new Image(); im.onerror = no; im.onload = () => {
    const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', .7));
  }; im.src = r.result; };
  r.readAsDataURL(file);
});
const zoom = src => { const v = document.createElement('div'); v.className = 'viewer'; v.innerHTML = `<img src="${esc(src)}" alt="">`; v.onclick = () => v.remove(); document.body.appendChild(v); };
const shrink = file => new Promise((ok,no) => {
  const r = new FileReader();
  r.onerror = no;
  r.onload = () => { const im = new Image(); im.onerror = no; im.onload = () => {
    const c = document.createElement('canvas'), n = 120; c.width = c.height = n;
    const s = Math.min(im.width, im.height), x = (im.width-s)/2, y = (im.height-s)/2;
    c.getContext('2d').drawImage(im, x, y, s, s, 0, 0, n, n); ok(c.toDataURL('image/jpeg', .75));
  }; im.src = r.result; };
  r.readAsDataURL(file);
});

/* ---------- สถานะ ---------- */
const U = {};
let notice = '', me = null, mode = 'signup', pic = '', room = null, posts = [], filter = 'all', unwatch = null;

function render() { me ? (room ? feed() : lobby()) : auth(); }

/* ---------- หน้าเข้าสู่ระบบ ---------- */
function auth() {
  $('#app').innerHTML = `
  <div class="hero"><img class="brand" src="${LOGO}" alt="ฝากงาน Fak ngan"></div>
  <div class="panel">
    <div class="tabs"><button data-m="signup" class="${mode==='signup'?'on':''}">สมัครใหม่</button><button data-m="login" class="${mode==='login'?'on':''}">เข้าสู่ระบบ</button></div>
    ${mode==='signup' ? `<div class="pick"><label for="file" style="cursor:pointer;text-align:center;margin:12px 0 0">${av(pic,'🙂')}<small style="color:var(--pink)">แตะเพื่อเลือกรูปโปรไฟล์</small></label><input id="file" type="file" accept="image/*" class="hide"></div>` : ''}
    <label for="u">ชื่อผู้ใช้</label><input id="u" maxlength="20" autocomplete="username" placeholder="เช่น น้องมิ้นท์">
    <label for="p">รหัสผ่าน</label><input id="p" type="password" autocomplete="${mode==='signup'?'new-password':'current-password'}" placeholder="อย่างน้อย 6 ตัว">
    <div class="err" id="err">${esc(notice)}</div>
    <button class="btn" id="go">${mode==='signup'?'สมัครและเข้าเว็บ':'เข้าสู่ระบบ'}</button>
  </div>
  ${LIVE ? '' : '<div class="note">โหมดทดลอง: ข้อมูลเก็บในเครื่องนี้เท่านั้น (ยังไม่ได้ใส่ค่า Firebase)</div>'}`;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { mode = b.dataset.m; render(); });
  const fi = $('#file'); if (fi) fi.onchange = async e => { if (e.target.files[0]) { try { pic = await shrink(e.target.files[0]); const u=$('#u').value; render(); $('#u').value=u; } catch(x){ $('#err').textContent='ใช้รูปนี้ไม่ได้ ลองรูปอื่นนะ'; } } };
  $('#go').onclick = submitAuth;
  $('#p').onkeydown = e => { if (e.key === 'Enter') submitAuth(); };
}
async function submitAuth() {
  const name = $('#u').value.trim(), pw = $('#p').value, err = $('#err'), btn = $('#go');
  if (!name) return err.textContent = 'ใส่ชื่อผู้ใช้ก่อนนะ';
  if (pw.length < 6) return err.textContent = 'รหัสผ่านต้องมีอย่างน้อย 6 ตัว';
  const id = name.toLowerCase().replace(/\s+/g, '');
  btn.disabled = true; err.textContent = ''; notice = '';
  try {
    const u = mode === 'signup' ? await DB.signup(id, name, pw, pic) : await DB.login(id, pw);
    if (u.banned) { await DB.logout(); err.textContent = 'บัญชีนี้ถูกแบน'; btn.disabled = false; return; }
    me = u; try { localStorage.setItem('fn_me', JSON.stringify(me)); } catch(e){}
    pic = ''; render();
  } catch(e) {
    const c = (e && e.code) || '';
    err.textContent = c === 'auth/email-already-in-use' ? 'ชื่อนี้มีคนใช้แล้ว ลองชื่ออื่นนะ'
      : /invalid|wrong-password|user-not-found/.test(c) ? 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'
      : c === 'auth/operation-not-allowed' ? 'ยังไม่ได้เปิด Email/Password ใน Firebase Authentication'
      : c === 'auth/configuration-not-found' ? 'ยังไม่ได้กด Get started ใน Firebase Authentication'
      : c === 'permission-denied' ? 'Firestore Rules ยังไม่ได้วางหรือยังไม่ได้ Publish'
      : 'เชื่อมต่อไม่ได้ ลองใหม่อีกครั้งนะ (' + (c || (e && e.message) || 'unknown') + ')';
    btn.disabled = false;
  }
}
async function logout() { try { localStorage.removeItem('fn_me'); } catch(e){} try { await DB.logout(); } catch(e){} me = null; room = null; if (unwatch) unwatch(); render(); }

/* ---------- หน้าเลือกห้อง ---------- */
function lobby() {
  $('#app').innerHTML = `
  <div class="top"><button class="pbtn" data-prof aria-label="แก้ไขโปรไฟล์">${av(me.avatar, me.name, 'sm')}</button><div class="grow"><small>สวัสดี · แตะรูปเพื่อแก้โปรไฟล์</small><h2>${esc(me.name)}</h2></div>${me.admin ? '<button class="btn ghost" id="adm" aria-label="แอดมิน">🛡</button>' : ''}<button class="btn ghost" id="out">ออก</button></div>
  <img class="brand s" src="${LOGO}" alt="ฝากงาน">
  <h3 style="margin:6px 0 12px">เลือกห้องของเรา 🏫</h3>
  <div class="rooms">${ROOMS.map(n => `<button class="room" data-r="${n}">ม.3/${n}</button>`).join('')}</div>`;
  $('#out').onclick = logout;
  document.querySelectorAll('[data-prof]').forEach(b => b.onclick = profileSheet);
  if (me.admin) $('#adm').onclick = adminSheet;
  document.querySelectorAll('.room').forEach(b => b.onclick = () => openRoom(+b.dataset.r));
}

/* ---------- หน้าห้อง ---------- */
function openRoom(n) {
  room = n; filter = 'all'; posts = [];
  if (unwatch) unwatch();
  feed();
  unwatch = DB.watch(n, list => { posts = list.sort((a,b) => b.createdAt - a.createdAt); drawPosts(); });
}
function feed() {
  $('#app').innerHTML = `
  <div class="top"><button class="btn ghost" id="back">← ห้อง</button><div class="grow"><h2>ม.3/${room}</h2></div><button class="pbtn" data-prof aria-label="แก้ไขโปรไฟล์">${av(me.avatar, me.name, 'sm')}</button></div>
  <div class="chips" id="chips">
    ${[['all','ทั้งหมด'],['todo','📌 งานค้าง'],['answer','✅ เฉลย/งานเสร็จ']].map(([k,t]) => `<button class="chip ${filter===k?'on':''}" data-f="${k}">${t}</button>`).join('')}
  </div>
  <div id="list"></div>
  <button class="btn fab" id="add">＋ ฝากงาน</button>`;
  $('#back').onclick = () => { room = null; if (unwatch) unwatch(); lobby(); };
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => { filter = c.dataset.f; document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c)); drawPosts(); });
  $('#add').onclick = composer;
  document.querySelectorAll('[data-prof]').forEach(b => b.onclick = profileSheet);
  drawPosts();
}
function drawPosts() {
  const el = $('#list'); if (!el) return;
  const miss = [...new Set(posts.map(p => p.uid))].filter(u => u && !(u in U));
  if (miss.length) { miss.forEach(u => U[u] = null); DB.getUsers(miss).then(r => { r.forEach(([id,d]) => U[id] = {name:d.name, avatar:d.avatar || ''}); drawPosts(); }).catch(() => {}); }
  const list = posts.filter(p => filter === 'all' || p.type === filter);
  if (!list.length) { el.innerHTML = `<div class="empty"><div class="logo">🌱</div><p>ยังไม่มีโพสต์ในห้องนี้<br>เป็นคนแรกที่ฝากงานเลย!</p></div>`; return; }
  el.innerHTML = list.map(p => {
    const url = safeUrl(p.link), pu = U[p.uid] || {}, nm = pu.name || p.name, ph = pu.name ? pu.avatar : p.avatar;
    return `<div class="post">
      <div class="who">${av(ph, nm)}<div><b>${esc(nm)}</b><small>${ago(p.createdAt)}</small></div></div>
      <span class="tag ${p.type}">${p.type==='todo'?'📌 งานค้าง':'✅ เฉลย/งานเสร็จ'}</span><span class="tag sub">${esc(p.subject)}</span>
      <h3>${esc(p.title)}</h3>
      ${p.detail ? `<p>${esc(p.detail)}</p>` : ''}
      ${p.due ? `<div class="due">⏰ ส่งวันที่ ${esc(new Date(p.due).toLocaleDateString('th-TH',{day:'numeric',month:'short'}))}</div>` : ''}
      ${(p.images && p.images.length) ? `<div class="thumbs ${p.images.length===1?'one':''}">${p.images.map(s => `<img src="${esc(s)}" alt="รูปประกอบ" loading="lazy">`).join('')}</div>` : ''}
      <div class="acts">${url ? `<a class="link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">🔗 เปิดลิงก์</a>` : ''}<span class="rt">${me.admin && p.uid !== me.id ? `<button class="ban" data-b="${esc(p.uid)}" data-n="${esc(nm)}">🚫 แบน</button>` : ''}${(p.uid === me.id || me.admin) ? `<button class="del" data-d="${esc(p.id)}">ลบโพสต์</button>` : ''}</span></div>
    </div>`;
  }).join('');
  el.querySelectorAll('.thumbs img').forEach(i => i.onclick = () => zoom(i.src));
  el.querySelectorAll('.del').forEach(b => b.onclick = () => { if (confirm('ลบโพสต์นี้ใช่ไหม?')) DB.del(b.dataset.d).catch(() => alert('ลบไม่ได้ ลบได้เฉพาะโพสต์ของตัวเอง')); });
  el.querySelectorAll('.ban').forEach(b => b.onclick = async () => { if (confirm('แบน ' + b.dataset.n + ' ใช่ไหม?\nจะโพสต์และเข้าสู่ระบบไม่ได้')) { try { await DB.ban(b.dataset.b, b.dataset.n); alert('แบนแล้ว'); } catch(e) { alert('แบนไม่สำเร็จ'); } } });
}

/* ---------- ฟอร์มโพสต์ ---------- */
function composer() {
  let type = 'todo';
  const s = document.createElement('div'); s.className = 'sheet';
  s.innerHTML = `<div role="dialog" aria-label="ฝากงาน">
    <h3 style="margin-bottom:10px">ฝากงานให้ ม.3/${room}</h3>
    <div class="seg" id="seg"><button data-t="todo" class="on todo">📌 งานค้าง</button><button data-t="answer">✅ เฉลย/งานเสร็จ</button></div>
    <label for="sj">วิชา</label><select id="sj">${SUBJECTS.map(x => `<option>${x}</option>`).join('')}</select>
    <label for="ti">หัวข้อ</label><input id="ti" maxlength="80" placeholder="เช่น แบบฝึกหัดบทที่ 3 หน้า 45">
    <label for="de">รายละเอียด (ไม่ใส่ก็ได้)</label><textarea id="de" rows="3" maxlength="500"></textarea>
    <label for="li">ลิงก์ (ไม่ใส่ก็ได้)</label><input id="li" inputmode="url" placeholder="ลิงก์เฉลย / ไฟล์งาน">
    <label>รูปภาพ (ไม่ใส่ก็ได้ สูงสุด 3 รูป)</label>
    <div class="pics" id="pics"></div><input id="imf" type="file" accept="image/*" multiple class="hide">
    <div id="dw"><label for="du">กำหนดส่ง (ไม่ใส่ก็ได้)</label><input id="du" type="date"></div>
    <div class="err" id="e2"></div>
    <button class="btn" id="ok">โพสต์เลย</button>
    <button class="btn ghost" id="no" style="width:100%;margin-top:10px">ยกเลิก</button>
  </div>`;
  document.body.appendChild(s);
  const close = () => s.remove();
  s.onclick = e => { if (e.target === s) close(); };
  $('#no').onclick = close;
  s.querySelectorAll('#seg button').forEach(b => b.onclick = () => {
    type = b.dataset.t;
    s.querySelectorAll('#seg button').forEach(x => x.className = x === b ? 'on ' + type : '');
    $('#dw').classList.toggle('hide', type !== 'todo');
  });
  let imgs = [];
  const drawPics = () => {
    $('#pics').innerHTML = imgs.map((s,i) => `<div class="ph"><img src="${s}" alt=""><button data-i="${i}" aria-label="ลบรูป">✕</button></div>`).join('') + (imgs.length < 3 ? `<label for="imf" class="addp" aria-label="เพิ่มรูป">📷</label>` : '');
    $('#pics').querySelectorAll('button').forEach(b => b.onclick = () => { imgs.splice(+b.dataset.i, 1); drawPics(); });
  };
  drawPics();
  $('#imf').onchange = async e => {
    $('#e2').textContent = '';
    for (const f of [...e.target.files].slice(0, 3 - imgs.length)) {
      try { imgs.push(await fit(f)); } catch(x) { $('#e2').textContent = 'ใช้รูปบางรูปไม่ได้ ลองรูปอื่นนะ'; }
    }
    e.target.value = ''; drawPics();
  };
  $('#ok').onclick = async () => {
    const title = $('#ti').value.trim(), link = $('#li').value.trim();
    if (!title) return $('#e2').textContent = 'ใส่หัวข้อก่อนนะ';
    if (link && !safeUrl(link)) return $('#e2').textContent = 'ลิงก์ไม่ถูกต้อง';
    $('#ok').disabled = true;
    try {
      await DB.add({room, type, subject: $('#sj').value, title, detail: $('#de').value.trim(), link: link ? safeUrl(link) : '', due: type === 'todo' ? $('#du').value : '', uid: me.id, name: me.name, avatar: me.avatar || '', images: imgs, createdAt: Date.now()});
      close();
    } catch(e) { $('#e2').textContent = (e && e.code === 'permission-denied') ? 'โพสต์ไม่ได้ บัญชีอาจถูกแบน' : 'โพสต์ไม่สำเร็จ ลองใหม่นะ'; $('#ok').disabled = false; }
  };
}

function profileSheet() {
  let np = me.avatar || '';
  const s = document.createElement('div'); s.className = 'sheet';
  s.innerHTML = `<div role="dialog" aria-label="แก้ไขโปรไฟล์"><h3 style="margin-bottom:6px">แก้ไขโปรไฟล์</h3>
    <div class="pick"><label for="pf" style="cursor:pointer;text-align:center;margin:8px 0 0"><span id="pv"></span><small style="display:block;color:var(--pink)">แตะเพื่อเปลี่ยนรูป</small></label><input id="pf" type="file" accept="image/*" class="hide"></div>
    <label for="pn">ชื่อที่แสดง</label><input id="pn" maxlength="20" value="${esc(me.name)}">
    <p class="note" style="text-align:left">ชื่อที่ใช้เข้าสู่ระบบยังเป็นชื่อเดิม ไม่เปลี่ยนตาม</p>
    <div class="err" id="pe"></div><button class="btn" id="ps">บันทึก</button>
    <button class="btn ghost" id="pc" style="width:100%;margin-top:10px">ยกเลิก</button></div>`;
  document.body.appendChild(s);
  const close = () => s.remove(), draw = () => { $('#pv').innerHTML = av(np, me.name); };
  draw();
  s.onclick = e => { if (e.target === s) close(); };
  $('#pc').onclick = close;
  $('#pf').onchange = async e => { if (e.target.files[0]) { try { np = await shrink(e.target.files[0]); draw(); } catch(x) { $('#pe').textContent = 'ใช้รูปนี้ไม่ได้ ลองรูปอื่นนะ'; } } };
  $('#ps').onclick = async () => {
    const nm = $('#pn').value.trim();
    if (!nm) return $('#pe').textContent = 'ใส่ชื่อก่อนนะ';
    $('#ps').disabled = true;
    try {
      await DB.updateProfile(me.id, {name: nm, avatar: np});
      me = {...me, name: nm, avatar: np}; U[me.id] = {name: nm, avatar: np};
      try { localStorage.setItem('fn_me', JSON.stringify(me)); } catch(e){}
      close(); render();
    } catch(e) { $('#pe').textContent = (e && e.code === 'permission-denied') ? 'บันทึกไม่ได้ บัญชีอาจถูกแบน' : 'บันทึกไม่สำเร็จ ลองใหม่นะ'; $('#ps').disabled = false; }
  };
}
function adminSheet() {
  const s = document.createElement('div'); s.className = 'sheet';
  s.innerHTML = `<div><h3>🛡 แอดมิน · คนที่ถูกแบน</h3><div id="bl" style="margin:12px 0"></div><button class="btn ghost" id="x" style="width:100%">ปิด</button></div>`;
  document.body.appendChild(s);
  const un = DB.bans(l => {
    $('#bl').innerHTML = l.length ? l.map(b => `<div class="who" style="justify-content:space-between"><b>${esc(b.name)}</b><button class="btn ghost" data-u="${esc(b.id)}">ปลดแบน</button></div>`).join('') : '<p class="note">ยังไม่มีใครถูกแบน</p>';
    $('#bl').querySelectorAll('[data-u]').forEach(x => x.onclick = () => DB.unban(x.dataset.u));
  });
  const close = () => { un(); s.remove(); };
  s.onclick = e => { if (e.target === s) close(); };
  $('#x').onclick = close;
}

DB.restore().then(async u => {
  if (u && u.banned) { await DB.logout(); notice = 'บัญชีนี้ถูกแบน'; u = null; }
  me = u; render();
});
</script>
</body>
</html>
